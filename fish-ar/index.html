<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Рыбы AR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05080c;font-family:system-ui,Roboto,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
video{display:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:3;background:radial-gradient(circle at 50% 40%,rgba(20,40,60,.55),rgba(0,0,0,.75));padding:20px;text-align:center}
#start h1{margin:0 0 4px;font:800 30px system-ui}#start p{margin:0 0 10px;opacity:.8;max-width:420px;line-height:1.4}
button{font:700 18px system-ui;padding:15px 24px;border-radius:18px;border:0;background:#1e88e5;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.4);min-width:260px}
button.ar{background:#ff8a2a}
#bar{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:none;gap:10px;justify-content:center;z-index:2}
#bar button{min-width:0;padding:12px 16px;font-size:16px;background:rgba(20,24,30,.7);backdrop-filter:blur(6px)}
#bar button.rec{background:#d32f2f}
#msg{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));text-align:center;z-index:2;font:600 14px system-ui;text-shadow:0 1px 4px #000;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><video id="v" playsinline muted></video>
<div id="msg"></div>
<div id="start"><h1>🐟 Рыбы AR</h1><p>Стая сардин плавает вокруг тебя, заходит за спину и разбегается от твоих рук.</p>
<button id="bCam">📱 Камера (телефон)</button><button class="ar" id="bAR" hidden>🥽 Рыбы в моей комнате (AR)</button><button id="bVR" hidden>🌊 Под водой (VR)</button>
<p style="font-size:13px;opacity:.6;margin-top:10px">На телефоне: встань в кадр целиком по пояс, помаши руками. Кнопка ⏺ записывает ролик.</p></div>
<div id="bar"><button id="bFlip">🔄 Камера</button><button id="bRec">⏺ Запись</button><button id="bMore">🐟 Больше</button></div>


<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module" src="app.js"></script>
</body></html>
