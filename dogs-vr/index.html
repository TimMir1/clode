<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Собачки VR</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b1d26">
<style>

#c{position:fixed;inset:0;width:100%;height:100%;display:block}

</style></head><body>
<canvas id="c"></canvas>
<div id="msg">Собачки Бобик и Шарик. Нажми на собаку: она спросит, чем помочь.</div>
<div id="ui"><button class="ar" id="bAR" hidden>🐶 В мою комнату (AR)</button><button id="bVR" hidden>🏠 В виртуальную комнату (VR)</button></div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
var T=THREE,PI=Math.PI,K=0.0085;
var cv=document.getElementById('c'),msg=document.getElementById('msg');
var R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(innerWidth,innerHeight,false);
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
R.xr.enabled=true;R.xr.setReferenceSpaceType('local-floor');
var scene=new T.Scene();
var cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,60);cam.position.set(0,1.55,.7);cam.lookAt(0,.45,-2);
scene.add(cam);
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight,false)});
function rnd(a,b){return a+Math.random()*(b-a)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function angD(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}

/* ---------- light & room ---------- */
scene.add(new T.HemisphereLight(0xfff8ee,0x7a6a5a,1.6));
var sun=new T.DirectionalLight(0xffffff,2.6);sun.position.set(1.5,4,2);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);var sc=sun.shadow.camera;sc.left=-4;sc.right=4;sc.top=4;sc.bottom=-4;sc.near=.5;sc.far=12;sun.shadow.bias=-.0005;sun.shadow.radius=4;
scene.add(sun);scene.add(sun.target);
var shadowFloor=new T.Mesh(new T.PlaneGeometry(14,14),new T.ShadowMaterial({opacity:.32}));
shadowFloor.rotation.x=-PI/2;shadowFloor.receiveShadow=true;scene.add(shadowFloor);
var room=new T.Group();scene.add(room);
(function(){
  var c=document.createElement('canvas');c.width=c.height=512;var g=c.getContext('2d');
  g.fillStyle='#c9a57c';g.fillRect(0,0,512,512);
  for(var i=0;i<8;i++){g.fillStyle=i%2?'#c19d72':'#cfab82';g.fillRect(0,i*64,512,64);g.fillStyle='rgba(80,50,20,.25)';g.fillRect(0,i*64,512,2);
    for(var j=0;j<30;j++){g.fillStyle='rgba(90,60,30,.07)';g.fillRect(rnd(0,512),i*64+rnd(4,60),rnd(30,140),1.5)}
    g.fillStyle='rgba(80,50,20,.25)';g.fillRect((i*137)%512,i*64,2,64)}
  var tx=new T.CanvasTexture(c);tx.wrapS=tx.wrapT=T.RepeatWrapping;tx.repeat.set(7,7);tx.colorSpace=T.SRGBColorSpace;
  var f=new T.Mesh(new T.CircleGeometry(9,64),new T.MeshStandardMaterial({map:tx,roughness:.85}));
  f.rotation.x=-PI/2;f.position.y=-.002;f.receiveShadow=true;room.add(f);
  var wall=new T.Mesh(new T.CylinderGeometry(9,9,4,64,1,true),new T.MeshStandardMaterial({color:0xeee6da,side:T.BackSide,roughness:1}));
  wall.position.y=2;room.add(wall);
  var rug=new T.Mesh(new T.CircleGeometry(1.4,48),new T.MeshStandardMaterial({color:0x6b8fb8,roughness:1}));
  rug.rotation.x=-PI/2;rug.position.set(0,.001,-1.9);rug.receiveShadow=true;room.add(rug);
})();
var arMode=false;
function setMode(ar){arMode=ar;room.visible=!ar;shadowFloor.visible=ar;scene.background=ar?null:new T.Color(0xdfe9f2)}
setMode(false);

/* ---------- audio ---------- */
var listener=new T.AudioListener();cam.add(listener);
var barkBuf=[];
function makeBark(p){
  var ctx=listener.context,sr=ctx.sampleRate,n=(sr*.3)|0,b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0),ph=0,lp=0;
  for(var i=0;i<n;i++){var t=i/sr,f=p*(1.3-t*2.4)*(1+.04*Math.sin(t*90));
    var env=t<.012?t/.012:Math.exp(-(t-.012)*13);ph+=2*PI*f/sr;
    var s=Math.sin(ph)+.7*Math.sin(2*ph+.4)+.45*Math.sin(3*ph+1)+.25*Math.sin(5*ph)+(Math.random()*2-1)*.5;
    lp+= (s-lp)*.35;d[i]=lp*env*.32}
  return b;
}
function audioInit(){try{listener.context.resume();if(!barkBuf.length){barkBuf=[makeBark(430),makeBark(560)]}}catch(e){}}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.pitch=1.45;u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- sprites (bubbles, hearts) ---------- */
function textTex(txt,bg,fg,fs){
  var c=document.createElement('canvas'),g=c.getContext('2d');fs=fs||56;g.font='700 '+fs+'px system-ui,Roboto,sans-serif';
  var w=Math.ceil(g.measureText(txt).width)+60,h=fs+60;c.width=w;c.height=h+24;g=c.getContext('2d');g.font='700 '+fs+'px system-ui,Roboto,sans-serif';
  if(bg){g.fillStyle=bg;rr(g,4,4,w-8,h-8,34);g.fill();g.beginPath();g.moveTo(w/2-18,h-6);g.lineTo(w/2,h+20);g.lineTo(w/2+18,h-6);g.fill()}
  g.fillStyle=fg||'#222';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,h/2);
  var t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return {t:t,w:c.width,h:c.height};
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
var fxs=[];
function floatFx(txt,pos,col){
  var tt=textTex(txt,null,col||'#e33',64),s=new T.Sprite(new T.SpriteMaterial({map:tt.t,transparent:true,depthWrite:false}));
  s.scale.set(tt.w/tt.h*.12,.12,1);s.position.copy(pos);scene.add(s);fxs.push({s:s,t:0,life:1.6});
}

/* ---------- dog model ---------- */
var SPH=new T.SphereGeometry(1,28,18);
function mat(c,r){return new T.MeshStandardMaterial({color:c,roughness:r==null?.82:r,metalness:0})}
function S(par,m,sx,sy,sz,x,y,z){var o=new T.Mesh(SPH,m);o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=true;par.add(o);return o}
function G(par,x,y,z){var g=new T.Group();g.position.set(x||0,y||0,z||0);par.add(g);return g}
function caps(par,m,r,len,y){var o=new T.Mesh(new T.CapsuleGeometry(r,len,6,14),m);o.position.y=y;o.castShadow=true;par.add(o);return o}
function makeDog(o){
  var M=mat(o.body),Mb=mat(o.belly),Me=mat(o.ear),Mk=mat(0x120d0a,.2),Mw=new T.MeshBasicMaterial({color:0xffffff}),
      Mt=mat(0xff6f86,.4),Mc=mat(o.collar,.4),Mg=mat(0xffc93c,.2),Mm=o.muzzle?mat(o.muzzle):Mb;
  var root=new T.Group(),body=G(root,0,30,0);
  S(body,M,22,12,11.5,-3,0,0);S(body,M,12.5,13,12,11,2,0);S(body,M,11.5,11.5,11.5,-15,1,0);S(body,Mb,15,6.5,8.5,3,-6.5,0);
  (o.spots||[]).forEach(function(s){S(body,Me,s[3],s[4],s[5],s[0],s[1],s[2])});
  var neck=G(body,17,7,0);S(neck,M,7.5,10,8,2,4,0);
  var cg=G(neck,1.5,1,0);cg.rotation.z=-.75;var col=new T.Mesh(new T.TorusGeometry(8.2,1.7,10,28),Mc);col.rotation.y=PI/2;col.castShadow=true;cg.add(col);
  S(cg,Mg,2.2,2.6,1.3,-1,-9.4,0);
  var head=G(neck,5,13,0);
  S(head,M,10.5,10,9.6,0,0,0);S(head,M,7,5,7,-4,-5,0);S(head,Mm,8.2,5.4,6.4,9.5,-3.2,0);S(head,Mk,2.9,2.3,3.1,17.2,-1.6,0);
  var eyes=[];
  [-1,1].forEach(function(s){var e=G(head,7,2.6,s*5.4);S(e,Mk,2.1,2.5,1.8,0,0,0);S(e,Mw,.65,.65,.5,1.2,.9,s*1.2);eyes.push(e);
    if(o.patch&&s===1)S(head,Me,5,4.5,2.2,6,2.8,s*5.6)});
  var jaw=G(head,6,-6.4,0);S(jaw,Mm,7.5,2,5,5,-.3,0);var tongue=G(jaw,8,1,0);S(tongue,Mt,5.2,1,3.4,3,0,0);
  var ears=[];
  [-1,1].forEach(function(s){var ep=G(head,-1.5,7.5,s*7.6);S(ep,Me,5,9.5,2.2,0,-7,s*.6);ep.userData.s=s;ears.push(ep)});
  var legs=[];
  [[15,6.5,1],[15,-6.5,1],[-15,6.5,0],[-15,-6.5,0]].forEach(function(L){
    var hip=G(body,L[0],-4,L[1]);caps(hip,M,L[2]?4.1:4.5,6.5,-6.5);
    var knee=G(hip,0,-13,0);caps(knee,M,3.3,6,-5);S(knee,o.paw?mat(o.paw):Mb,4.8,2.8,4.1,1.6,-11.6,0);
    legs.push({hip:hip,knee:knee,front:!!L[2],rx:L[0]});
  });
  var tail=[],tp=G(body,-25,5,0);
  for(var i=0;i<5;i++){var seg=G(i?tail[i-1]:tp,i?-5:0,0,0);
    var c=new T.Mesh(new T.CapsuleGeometry(2.7-i*.32,3.6,4,10),i===4&&o.tip?mat(o.tip):M);c.rotation.z=PI/2;c.position.x=-2.5;c.castShadow=true;seg.add(c);tail.push(seg)}
  root.scale.setScalar(K);scene.add(root);
  return {root:root,body:body,neck:neck,head:head,jaw:jaw,tongue:tongue,ears:ears,eyes:eyes,legs:legs,tail:tail};
}
function ik(hx,hy,fx,fy,L1,L2,front){
  var dx=fx-hx,dy=fy-hy,d=clamp(Math.hypot(dx,dy),Math.abs(L1-L2)+.5,L1+L2-.05);
  var phi=Math.atan2(dx,-dy),a=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  var t1=front?phi+a*.9:phi-a,kx=hx+L1*Math.sin(t1),ky=hy-L1*Math.cos(t1);
  return [t1,Math.atan2(fx-kx,-(fy-ky))];
}

/* ---------- windows (panels) ---------- */
var panels=[];
var PANEL_TEXT=[
  {title:'📝 Заметки',lines:['Купить корм для собак','Позвонить маме вечером','Забрать посылку на почте','Встреча в пятницу в 15:00','Полить цветы на балконе','Записать идеи для видео','Пароль от Wi-Fi на холодильнике']},
  {title:'📰 Новости',lines:['В Москве ожидается снег','Курс доллара снова вырос','Новый парк откроют весной','Учёные нашли древний город','Команда выиграла финал','Метро продлит работу','Завтра солнечная погода']},
  {title:'🛒 Покупки',lines:['Молоко 2 пакета','Хлеб чёрный','Яблоки зелёные','Сыр и колбаса','Шоколад для Миры','Батарейки AA','Кофе в зёрнах']}
];
var PW=1.1,PH=1.3,PPM=620;
function makePanel(i,x,z){
  var c=document.createElement('canvas');c.width=PW*PPM;c.height=PH*PPM;
  var tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;tex.anisotropy=4;
  var g=new T.Group();g.position.set(x,0,z);g.rotation.y=Math.atan2(-x,-z);
  var m=new T.Mesh(new T.PlaneGeometry(PW,PH),new T.MeshBasicMaterial({map:tex,transparent:true}));m.position.y=.08+PH/2;
  var back=new T.Mesh(new T.PlaneGeometry(PW,PH),new T.MeshStandardMaterial({color:0x2a2d38,roughness:.6,side:T.BackSide}));back.position.copy(m.position);back.castShadow=true;
  g.add(back);g.add(m);scene.add(g);
  var p={i:i,g:g,mesh:m,c:c,tex:tex,data:PANEL_TEXT[i],layout:[],hl:[]};drawPanel(p);panels.push(p);return p;
}
function drawPanel(p){
  var g=p.c.getContext('2d'),w=p.c.width,h=p.c.height;g.clearRect(0,0,w,h);
  g.fillStyle='rgba(28,30,40,.94)';rr(g,6,6,w-12,h-12,40);g.fill();
  g.fillStyle='rgba(255,255,255,.08)';rr(g,6,6,w-12,100,40);g.fill();
  g.fillStyle='#fff';g.font='700 46px system-ui,Roboto,sans-serif';g.textBaseline='middle';g.fillText(p.data.title,40,58);
  g.fillStyle='rgba(255,255,255,.35)';[0,1,2].forEach(function(k){g.beginPath();g.arc(w-60-k*40,58,10,0,7);g.fill()});
  g.font='500 36px system-ui,Roboto,sans-serif';p.layout=[];
  p.hl.forEach(function(r){g.fillStyle='rgba(255,210,0,.9)';rr(g,r.x-8,r.y-6,r.w+16,r.h+12,10);g.fill()});
  p.data.lines.forEach(function(t,k){var y=150+k*92;g.fillStyle='#e9ecf5';g.fillText(t,44,y+24);p.layout.push({t:t,x:44,y:y,h:48})});
  p.hl.forEach(function(r){var L=p.layout[r.k];g.save();g.beginPath();g.rect(r.x,r.y-10,r.w,r.h+20);g.clip();g.fillStyle='#111';g.fillText(L.t,L.x,L.y+24);g.restore()});
  p.tex.needsUpdate=true;
}
function panelSeg(p){
  var a=new T.Vector3(1,0,0).applyQuaternion(p.g.quaternion),n=new T.Vector3(0,0,1).applyQuaternion(p.g.quaternion);
  a.y=0;n.y=0;a.normalize();n.normalize();var c=p.g.position;
  return {c:c,a:a,n:n,p1:{x:c.x-a.x*PW/2,z:c.z-a.z*PW/2},p2:{x:c.x+a.x*PW/2,z:c.z+a.z*PW/2}};
}
makePanel(0,-1.25,-1.9);makePanel(1,.35,-2.75);makePanel(2,1.6,-1.55);

function segX(ax,az,bx,bz,cx,cz,dx,dz){
  function o(px,pz,qx,qz,rx,rz){return (qx-px)*(rz-pz)-(qz-pz)*(rx-px)}
  return o(ax,az,bx,bz,cx,cz)*o(ax,az,bx,bz,dx,dz)<0&&o(cx,cz,dx,dz,ax,az)*o(cx,cz,dx,dz,bx,bz)<0;
}
function route(x0,z0,x1,z1){
  for(var i=0;i<panels.length;i++){var s=panelSeg(panels[i]);
    var e1x=s.p1.x-s.a.x*.42,e1z=s.p1.z-s.a.z*.42,e2x=s.p2.x+s.a.x*.42,e2z=s.p2.z+s.a.z*.42;
    if(segX(x0,z0,x1,z1,e1x,e1z,e2x,e2z)){
      var d1=Math.hypot(e1x-x0,e1z-z0)+Math.hypot(x1-e1x,z1-e1z),d2=Math.hypot(e2x-x0,e2z-z0)+Math.hypot(x1-e2x,z1-e2z);
      return d1<d2?[{x:e1x,z:e1z},{x:x1,z:z1}]:[{x:e2x,z:e2z},{x:x1,z:z1}];
    }}
  return [{x:x1,z:z1}];
}
function freeSpot(){
  for(var k=0;k<40;k++){var a=rnd(-PI*.42,PI*.42)+(Math.random()<.9?0:PI),r=rnd(.9,3.1),x=Math.sin(a)*r,z=-Math.cos(a)*r,ok=true;
    panels.forEach(function(p){var s=panelSeg(p),vx=x-s.c.x,vz=z-s.c.z,al=vx*s.a.x+vz*s.a.z,nl=vx*s.n.x+vz*s.n.z;if(Math.abs(al)<PW/2+.3&&Math.abs(nl)<.45)ok=false});
    if(ok)return {x:x,z:z}}
  return {x:0,z:-1.5};
}
var viewer=new T.Vector3();
function viewerPos(){(R.xr.isPresenting?R.xr.getCamera():cam).getWorldPosition(viewer);return viewer}

/* ---------- dog behaviour ---------- */
var DEF={sit:0,lie:0,bow:0,rear:0,hp:0,hy:0,ht:0,jaw:0,tongue:0,ear:0,tail:.55,wagA:.35,wagS:9,squash:0,sad:0,shut:0,pant:0,lick:0};
function Dog(i,opt){
  this.i=i;this.name=opt.name;this.m=makeDog(opt);this.pitch=opt.pitch;
  var s=freeSpot();this.x=s.x;this.z=s.z;this.elev=0;this.h=rnd(0,6);this.hWant=null;this.v=0;this.path=[];this.spd=.5;
  this.ph=rnd(0,6);this.t=0;this.air=null;this.w=Object.assign({},DEF);this.p=Object.assign({},DEF);this.blinkT=rnd(1,4);this.blink=0;
  this.bub=null;this.bubT=0;this.rearH=30;
  this.snd=new T.PositionalAudio(listener);this.snd.setRefDistance(.8);this.m.head.add(this.snd);
  this.m.root.traverse(function(o){o.userData.dog=i});
}
Dog.prototype.pose=function(o){this.w=Object.assign({},DEF,o||{})};
Dog.prototype.go=function(x,z,spd){this.path=route(this.x,this.z,x,z);this.spd=spd||.5;this.air=null};
Dog.prototype.arrived=function(){return !this.path.length};
Dog.prototype.faceTo=function(x,z){if(x&&x.x!==undefined){z=x.z;x=x.x}this.hWant=Math.atan2(-(z-this.z),x-this.x)};
Dog.prototype.faceViewer=function(){var v=viewerPos();this.faceTo(v.x,v.z)};
Dog.prototype.dist=function(o){return Math.hypot(o.x-this.x,o.z-this.z)};
Dog.prototype.hop=function(x,z,T_,hh){this.air={x0:this.x,z0:this.z,x1:x,z1:z,T:T_,t:0,h:hh};this.path=[]};
var tmpV=new T.Vector3();
Dog.prototype.headPt=function(){this.m.head.getWorldPosition(tmpV);return tmpV.clone()};
Dog.prototype.say=function(txt,sec){
  if(this.bub){scene.remove(this.bub);this.bub.material.map.dispose()}
  var tt=textTex(txt,'#ffffff','#222',54);this.bub=new T.Sprite(new T.SpriteMaterial({map:tt.t,transparent:true,depthWrite:false}));
  var hgt=.11;this.bub.scale.set(tt.w/tt.h*hgt,hgt,1);scene.add(this.bub);this.bubT=sec||2;
};
Dog.prototype.bark=function(txt){this.say(txt||'Гав!',1);try{if(barkBuf.length){if(this.snd.isPlaying)this.snd.stop();this.snd.setBuffer(barkBuf[this.i]);this.snd.setPlaybackRate(rnd(.92,1.08));this.snd.play()}}catch(e){}};
Dog.prototype.update=function(dt){
  var m=this.m,p=this.p,w=this.w,k;this.t+=dt;
  if(this.air){var a=this.air;a.t+=dt;var s=clamp(a.t/a.T,0,1);
    var nx=lerp(a.x0,a.x1,s),nz=lerp(a.z0,a.z1,s);this.v=Math.hypot(nx-this.x,nz-this.z)/Math.max(dt,.001);this.x=nx;this.z=nz;
    this.elev=4*a.h*s*(1-s);if(Math.hypot(a.x1-a.x0,a.z1-a.z0)>.02)this.hWant=Math.atan2(-(a.z1-a.z0),a.x1-a.x0);
    if(s>=1){this.air=null;this.elev=0;this.v=0;p.squash=.8}}
  else if(this.path.length){
    var tg=this.path[0],dx=tg.x-this.x,dz=tg.z-this.z,d=Math.hypot(dx,dz);
    if(d<.04){this.path.shift()}else{
      var want=Math.atan2(-dz,dx),df=angD(want,this.h),tr=(this.spd>1?7:4)*dt;
      this.h+=clamp(df,-tr,tr);this.hWant=null;
      var tv=this.spd*clamp(1-Math.abs(df)/1.5,.15,1)*Math.min(1,(this.path.length>1?1:d*2.5)+.25);
      this.v=lerp(this.v,tv,Math.min(1,dt*5));
      this.x+=Math.cos(this.h)*this.v*dt;this.z-=Math.sin(this.h)*this.v*dt;}}

var KB=['йцукенгшщзхъ','фывапролджэ','ячсмитьбю','1234567890'];
function showKeyboard(d){
  hideUI();typed='';var p=new UIPanel(.9,.6);p.title='Какое слово найти?';var W_=p.c.width,kw=(W_-40)/12;
  KB.forEach(function(row,r){var off=(W_-row.length*kw)/2;row.split('').forEach(function(ch,c){
    p.btn.push({l:ch,fs:34,x:off+c*kw+3,y:150+r*62,w:kw-6,h:56,fn:function(){typed+=ch;upd()}})})});
  p.btn.push({l:'⎵ пробел',x:30,y:150+4*62,w:W_*.36,h:56,fn:function(){typed+=' ';upd()}});
  p.btn.push({l:'⌫',x:30+W_*.36+12,y:150+4*62,w:W_*.16,h:56,fn:function(){typed=typed.slice(0,-1);upd()}});
  p.btn.push({l:'🔍 Найти',col:'#3a6df0',x:W_*.56+30,y:150+4*62,w:W_*.44-60,h:56,fn:function(){if(typed.trim())search(d.i,typed.trim())}});
  p.btn.push({l:'✕',x:W_-80,y:20,w:56,h:56,col:'rgba(255,80,80,.35)',fn:function(){hideUI();cur=null}});
  function upd(){p.title='Найти: '+(typed||'…')+'▏';p.draw()}
  p.draw();placeUI(p,d);scene.add(p.mesh);ui=p;
}
function listen(d){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){d.say('Голос тут не работает — набери слово 🙂',3);showKeyboard(d);return}
  try{var r=new SR();r.lang='ru-RU';r.interimResults=false;d.say('Слушаю… 👂',6);
    r.onresult=function(e){var t=e.results[0][0].transcript;d.say('«'+t+'»',2);voiceCmd(d.i,t)};
    r.onerror=function(){d.say('Не расслышал — набери слово',3);showKeyboard(d)};r.start()}catch(e){showKeyboard(d)}
}

/* ---------- pointing (controllers, hands, mouse) ---------- */
var ray=new T.Raycaster(),ctrls=[];
function pickables(){var a=[];if(ui)a.push(ui.mesh);dogs.forEach(function(d){a.push(d.m.root)});return a}
function hitTest(origin,dir){
  ray.set(origin,dir);ray.far=8;var hs=ray.intersectObjects(pickables(),true);
  for(var k=0;k<hs.length;k++){var o=hs[k].object;if(o.userData.ui)return {ui:o.userData.ui,uv:hs[k].uv,d:hs[k].distance};if(o.userData.dog!==undefined)return {dog:o.userData.dog,d:hs[k].distance}}
  // generous dog picking: nearest dog to the ray
  var best=null;dogs.forEach(function(dg){var c=new T.Vector3(dg.x,dg.elev+.3,dg.z),dd=ray.ray.distanceToPoint(c);if(dd<.22&&(!best||dd<best.dd))best={dog:dg.i,dd:dd,d:c.distanceTo(origin)}});
  return best;
}
function activate(h){if(!h)return;if(h.ui){var k=h.ui.hit(h.uv);if(k>=0){audioInit();h.ui.btn[k].fn()}}else if(h.dog!==undefined)tapDog(h.dog)}
for(var ci=0;ci<2;ci++)(function(ci){
  var c=R.xr.getController(ci);scene.add(c);
  var line=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(0,0,0),new T.Vector3(0,0,-1)]),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));
  line.scale.z=3;c.add(line);var dot=new T.Mesh(new T.SphereGeometry(.008,10,8),new T.MeshBasicMaterial({color:0xff8a2a}));dot.visible=false;scene.add(dot);
  c.addEventListener('select',function(){var o=new T.Vector3(),q=new T.Quaternion();c.getWorldPosition(o);c.getWorldQuaternion(q);activate(hitTest(o,new T.Vector3(0,0,-1).applyQuaternion(q)))});
  ctrls.push({c:c,line:line,dot:dot});
})(ci);
function updatePointers(){
  if(!R.xr.isPresenting)return;var hov=-1;
  ctrls.forEach(function(x){var o=new T.Vector3(),q=new T.Quaternion();x.c.getWorldPosition(o);x.c.getWorldQuaternion(q);
    var dir=new T.Vector3(0,0,-1).applyQuaternion(q),h=hitTest(o,dir);
    x.line.scale.z=h?h.d:3;x.dot.visible=!!h;if(h)x.dot.position.copy(o).addScaledVector(dir,h.d);
    if(h&&h.ui)hov=h.ui.hit(h.uv)});
  if(ui&&ui.hover!==hov){ui.hover=hov;ui.draw()}
}
cv.addEventListener('pointerdown',function(e){
  audioInit();var m=new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(m,cam);
  activate(hitTest(ray.ray.origin.clone(),ray.ray.direction.clone()));
});

/* ---------- XR session ---------- */
async function enter(mode){
  audioInit();
  try{var s=await navigator.xr.requestSession(mode,{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});
    setMode(mode==='immersive-ar');await R.xr.setSession(s);
    s.addEventListener('end',function(){setMode(false)});
  }catch(e){msg.textContent='Не удалось запустить '+mode+': '+e.message}
}
if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-ar').then(function(ok){var b=document.getElementById('bAR');b.hidden=!ok;b.onclick=function(){enter('immersive-ar')}}).catch(function(){});
  navigator.xr.isSessionSupported('immersive-vr').then(function(ok){var b=document.getElementById('bVR');b.hidden=!ok;b.onclick=function(){enter('immersive-vr')}}).catch(function(){});
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});

/* ---------- loop ---------- */
var clock=new T.Clock();
R.setAnimationLoop(function(){
  var dt=Math.min(.05,clock.getDelta());DT=dt;
  try{if(!cur)cur=pick();var r=cur.next();if(r.done)cur=null}catch(e){console.error(e);cur=null}
  dogs.forEach(function(d){try{d.update(dt)}catch(e){console.error(e)}});
  for(var k=fxs.length-1;k>=0;k--){var f=fxs[k];f.t+=dt;f.s.position.y+=dt*.12;f.s.material.opacity=1-f.t/f.life;if(f.t>f.life){scene.remove(f.s);f.s.material.map.dispose();fxs.splice(k,1)}}
  updatePointers();
  R.render(scene,cam);
});
window.__t={dogs:dogs,tapDog:tapDog,search:search,command:command,cam:cam,showKeyboard:showKeyboard,panels:panels,hide:function(){cur=hideSeek(dogs[0],dogs[1])},pounce:function(){cur=pounce(dogs[0],dogs[1])},lick:function(){cur=lick(dogs[0],dogs[1])}};
})();
</script></body></html>
