    const row = 100 + 2 * (bh + 14) + 6, sw = 198;
    [['🪭 Веер', fan], ['📚 Пачка ×10', () => stack(lastNote ? lastNote.userData.den : 1000, 10)], ['📄 Копия', () => lastNote && copyNote(lastNote, new T.Vector3(0.02, 0.002, 0.02))], ['🗑 Удалить', () => removeNote(lastNote)]]
      .forEach(([l, fn], i) => B.push({ x: 30 + i * (sw + 12), y: row, w: sw, h: 76, l, fn, col: '#3d4256' }));
    B.push({ x: 30, y: row + 88, w: 405, h: 66, l: gravity ? '⬇ Падают: ВКЛ' : '⬇ Падают: ВЫКЛ', fn: () => { gravity = !gravity; notes.forEach((n) => { if (!n.userData.held) n.userData.resting = !gravity; }); this.draw(); }, col: gravity ? '#2f7d4f' : '#3d4256' });
    B.push({ x: 450, y: row + 88, w: 420, h: 66, l: '🧹 Убрать все', fn: () => notes.slice().forEach((n) => { if (!n.userData.held) removeNote(n); }), col: '#8a2f2f' });
    this.btns = B;
    B.forEach((b, i) => { g.fillStyle = i === this.hover ? '#ff8a2a' : b.col; rrect(g, b.x, b.y, b.w, b.h, 18); g.fill(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = (i < 6 ? '800 44px Georgia,serif' : '600 30px system-ui'); g.fillText(b.l, b.x + b.w / 2, b.y + b.h / 2 + 2); g.textAlign = 'left'; });
    this.tex.needsUpdate = true;
  }
  hit(uv) { const x = uv.x * 900, y = (1 - uv.y) * 560; return this.btns.findIndex((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); }
}
const panel = new Panel(); panel.draw(); scene.add(panel.mesh);
function placePanel() {
  const { v, f } = viewer(); const sx = f.z, sz = -f.x;
  panel.mesh.position.set(v.x + f.x * 0.55 - sx * 0.38, v.y - 0.25, v.z + f.z * 0.55 - sz * 0.38);
  panel.mesh.lookAt(v.x, v.y - 0.1, v.z);
}
placePanel();

/* ---------- XR controllers ---------- */
const ray = new T.Raycaster(), ctrls = [];
function pick(origin, dir) {
  ray.set(origin, dir); ray.far = 6;
  const meshes = [panel.mesh]; notes.forEach((n) => { if (!n.userData.held) n.children.forEach((m) => meshes.push(m)); });
  const h = ray.intersectObjects(meshes, false)[0]; if (!h) return null;
  if (h.object.userData.panel) return { panel: true, uv: h.uv, d: h.distance };
  return { note: h.object.userData.note, d: h.distance, point: h.point };
}
for (let i = 0; i < 2; i++) {
  const c = R.xr.getController(i); scene.add(c);
  const line = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3(0, 0, -1)]), new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }));
  line.scale.z = 2; c.add(line);
  const dot = new T.Mesh(new T.SphereGeometry(0.006, 10, 8), new T.MeshBasicMaterial({ color: 0xff8a2a })); dot.visible = false; scene.add(dot);
  const st = { c, line, dot, src: null, held: null, prev: [] };
  c.addEventListener('connected', (e) => { st.src = e.data; });
  c.addEventListener('disconnected', () => { st.src = null; drop(st); });
  const rayFrom = () => { const o = new T.Vector3(), q = new T.Quaternion(); c.getWorldPosition(o); c.getWorldQuaternion(q); return [o, new T.Vector3(0, 0, -1).applyQuaternion(q)]; };
  const start = () => {
    if (st.held) return; const [o, d] = rayFrom(), h = pick(o, d); if (!h) return;
    if (h.panel) { const k = panel.hit(h.uv); if (k >= 0) panel.btns[k].fn(); return; }
    grab(st, h.note);
  };
  c.addEventListener('selectstart', start); c.addEventListener('squeezestart', start);
  c.addEventListener('selectend', () => drop(st)); c.addEventListener('squeezeend', () => { if (st.src && st.src.gamepad && st.src.gamepad.buttons[0] && st.src.gamepad.buttons[0].pressed) return; drop(st); });
  st.rayFrom = rayFrom; ctrls.push(st);
}
function grab(st, n) { ctrls.forEach((o) => { if (o.held === n) o.held = null; }); n.userData.held = true; n.userData.resting = true; st.c.attach(n); st.held = n; lastNote = n; pulse(st, 0.3, 40); }
function drop(st) { const n = st.held; if (!n) return; scene.attach(n); n.userData.held = false; n.userData.vy = 0; n.userData.resting = !gravity; st.held = null; }
function pulse(st, v, ms) { try { const a = st.src && st.src.gamepad && st.src.gamepad.hapticActuators && st.src.gamepad.hapticActuators[0]; if (a) a.pulse(v, ms); } catch (e) {} }
function pollControllers(dt) {
  ctrls.forEach((st) => {
    const [o, d] = st.rayFrom(), h = st.held ? null : pick(o, d);
    st.line.scale.z = h ? h.d : 2; st.dot.visible = !!h; if (h) st.dot.position.copy(o).addScaledVector(d, h.d);
    if (h && h.panel) { const k = panel.hit(h.uv); if (k !== panel.hover) { panel.hover = k; panel.draw(); } }
    const gp = st.src && st.src.gamepad; if (!gp) return;
    const ax = gp.axes, bt = gp.buttons.map((b) => b && b.pressed), was = st.prev; st.prev = bt;
    const sx = ax[2] || 0, sy = ax[3] || 0;
    if (st.held) {
      const n = st.held;
      if (Math.abs(sx) > 0.15) n.rotateOnWorldAxis(d, -sx * dt * 3);
      if (Math.abs(sy) > 0.15) { const lp = n.position.clone(); const len = clamp(lp.length() + sy * dt * 0.8, 0.05, 4); if (lp.lengthSq() > 1e-6) n.position.copy(lp.normalize().multiplyScalar(len)); }
      if (bt[3] && !was[3]) n.rotateY(PI);
      if (bt[4] && !was[4]) { copyNote(n); pulse(st, 0.5, 30); }
      if (bt[5] && !was[5]) { st.held = null; removeNote(n); }
    } else if (h && h.note) {
      if (bt[4] && !was[4]) copyNote(h.note, new T.Vector3(0.015, 0.002, 0.015));
      if (bt[5] && !was[5]) removeNote(h.note);
    }
  });
  if (!ctrls.some((s) => s.dot.visible && s.held === null && pick(...s.rayFrom())?.panel) && panel.hover !== -1) { panel.hover = -1; panel.draw(); }
}

/* ---------- gravity / flutter ---------- */
function floorY() { return arMode ? 0 : null; }
function physics(dt) {
  notes.forEach((n) => {
    const u = n.userData; if (u.held || u.resting) return;
    u.vy = Math.max(u.vy - 3 * dt, -0.9); n.position.y += u.vy * dt;
    n.position.x += Math.sin(performance.now() / 300 + u.spin * 5) * 0.08 * dt;
    // ground: table top (VR) or floor
    const onTable = !arMode && Math.abs(n.position.x) < 0.7 && n.position.z < -0.25 && n.position.z > -1.05 && n.position.y > TABLE_Y - 0.05;
    const gy = onTable ? TABLE_Y + 0.001 + notes.indexOf(n) * 0.0003 : 0.002 + notes.indexOf(n) * 0.0003;
    // tilt toward flat while falling
    const target = layFlatQuat(new T.Euler().setFromQuaternion(n.quaternion, 'YXZ').y);
    n.quaternion.slerp(target, Math.min(1, dt * 2.5));
    if (n.position.y <= gy) { n.position.y = gy; u.vy = 0; u.resting = true; n.quaternion.copy(target); }
  });
}

/* ---------- desktop / phone: mouse & touch ---------- */
let drag = null; const plane = new T.Plane(), hitP = new T.Vector3(), off = new T.Vector3();
function ndc(e) { return new T.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); }
cv.addEventListener('pointerdown', (e) => {
  ray.setFromCamera(ndc(e), cam); const h = pick(ray.ray.origin.clone(), ray.ray.direction.clone()); if (!h) return;
  if (h.panel) { const k = panel.hit(h.uv); if (k >= 0) panel.btns[k].fn(); return; }
  drag = h.note; lastNote = drag; drag.userData.held = true;
  plane.setFromNormalAndCoplanarPoint(new T.Vector3(0, 1, 0), h.point); off.copy(drag.position).sub(h.point); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => { if (!drag) return; ray.setFromCamera(ndc(e), cam); if (ray.ray.intersectPlane(plane, hitP)) drag.position.copy(hitP).add(off); });
cv.addEventListener('pointerup', () => { if (drag) { drag.userData.held = false; drag.userData.resting = !gravity; } drag = null; });
cv.addEventListener('wheel', (e) => { const n = drag || lastNote; if (n) n.rotateOnWorldAxis(new T.Vector3(0, 1, 0), e.deltaY * 0.003); e.preventDefault(); }, { passive: false });
cv.addEventListener('dblclick', (e) => { ray.setFromCamera(ndc(e), cam); const h = pick(ray.ray.origin.clone(), ray.ray.direction.clone()); if (h && h.note) copyNote(h.note, new T.Vector3(0.02, 0.0015, 0.02)); });

/* ---------- XR session ---------- */
async function enter(mode) {
  try {
    const s = await navigator.xr.requestSession(mode, { requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking'] });
    setMode(mode === 'immersive-ar'); await R.xr.setSession(s);
    setTimeout(() => { placePanel(); if (!notes.length) fan(); }, 600);
    s.addEventListener('end', () => { setMode(false); cam.position.set(0, 1.35, 0.35); cam.lookAt(0, 0.85, -0.55); placePanel(); });
  } catch (e) { $('msg').textContent = 'Не удалось запустить ' + mode + ': ' + e.message; }
}
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then((ok) => { $('bAR').hidden = !ok; $('bAR').onclick = () => enter('immersive-ar'); }).catch(() => {});
  navigator.xr.isSessionSupported('immersive-vr').then((ok) => { $('bVR').hidden = !ok; $('bVR').onclick = () => enter('immersive-vr'); }).catch(() => {});
}

/* ---------- start ---------- */
fan();
const clock = new T.Clock();
R.setAnimationLoop(() => { const dt = Math.min(0.05, clock.getDelta()); if (R.xr.isPresenting) pollControllers(dt); physics(dt); R.render(scene, cam); });
window.__m = { notes, spawnInFront, fan, stack, copyNote, cam, panel, scene, T };
</script></body></html>
