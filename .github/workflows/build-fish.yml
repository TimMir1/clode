name: Build Fish APK
on:
  workflow_dispatch:
  push:
    paths: ['fish/**', '.github/workflows/build-fish.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: fish
      - uses: actions/upload-artifact@v4
        with:
          name: fish-apk
          path: fish/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp fish/app/build/outputs/apk/debug/app-debug.apk Rybki.apk
          gh release delete fish-latest --yes --cleanup-tag || true
          gh release create fish-latest Rybki.apk --title "Рыбки (APK)" --notes "Скачай Rybki.apk и установи на телефон." --latest=false
