name: Build Money VR APK
on:
  workflow_dispatch:
  push:
    paths: ['moneyvr/**', '.github/workflows/build-moneyvr.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: moneyvr
      - uses: actions/upload-artifact@v4
        with:
          name: moneyvr-apk
          path: moneyvr/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp moneyvr/app/build/outputs/apk/debug/app-debug.apk Kupyury-VR.apk
          gh release delete moneyvr-latest --yes --cleanup-tag || true
          gh release create moneyvr-latest Kupyury-VR.apk --title "Купюры VR (APK)" --notes "Скачай Kupyury-VR.apk и установи на очки Quest (через SideQuest или файловый менеджер)." --latest=false
