name: Build Dogs VR APK
on:
  workflow_dispatch:
  push:
    paths: ['dogsvr/**', '.github/workflows/build-dogsvr.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: dogsvr
      - uses: actions/upload-artifact@v4
        with:
          name: dogsvr-apk
          path: dogsvr/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dogsvr/app/build/outputs/apk/debug/app-debug.apk Sobachki-VR.apk
          gh release delete dogsvr-latest --yes --cleanup-tag || true
          gh release create dogsvr-latest Sobachki-VR.apk --title "Собачки VR (APK)" --notes "Скачай Sobachki-VR.apk и установи на очки Quest (через SideQuest или файловый менеджер)." --latest=false
