name: Build Sketch VR APK
on:
  workflow_dispatch:
  push:
    paths: ['sketchvr/**', 'sketch-vr/**', '.github/workflows/build-sketchvr.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: sketchvr
      - uses: actions/upload-artifact@v4
        with:
          name: sketchvr-apk
          path: sketchvr/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp sketchvr/app/build/outputs/apk/debug/app-debug.apk Risovalka-VR.apk
          gh release delete sketchvr-latest --yes --cleanup-tag || true
          gh release create sketchvr-latest Risovalka-VR.apk --title "Рисовалка VR (APK)" --notes "Скачай Risovalka-VR.apk и установи на телефон или очки Quest." --latest=false
