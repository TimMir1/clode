name: Build Pet APK
on:
  workflow_dispatch:
  push:
    paths: ['pet/**', '.github/workflows/build-pet.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: pet
      - uses: actions/upload-artifact@v4
        with:
          name: pet-apk
          path: pet/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pet/app/build/outputs/apk/debug/app-debug.apk Pitomec.apk
          gh release delete pet-latest --yes --cleanup-tag || true
          gh release create pet-latest Pitomec.apk --title "Кот (APK)" --notes "Скачай Pitomec.apk и установи на телефон." --latest=false
